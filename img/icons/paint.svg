<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="palGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="70%" stop-color="#ecd6ab"/>
      <stop offset="100%" stop-color="#caa569"/>
    </radialGradient>
    <linearGradient id="brushMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#999999"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>
    <filter id="pDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Palette Board -->
  <path d="M 12 10 C 22 4, 38 7, 43 18 C 47 28, 42 41, 28 44 C 18 46, 7 42, 6 30 C 5 20, 5 14, 12 10 Z" fill="url(#palGrad)" stroke="#8e6732" stroke-width="1.2" filter="url(#pDrop)"/>
  <!-- Thumb Hole -->
  <ellipse cx="36" cy="34" rx="4.5" ry="3" fill="#3a70b0" stroke="#8e6732" stroke-width="1" transform="rotate(-20 36 34)"/>
  <!-- Color Blobs -->
  <circle cx="14" cy="16" r="3.2" fill="#e74c3c"/>
  <circle cx="21" cy="12" r="3.2" fill="#e67e22"/>
  <circle cx="29" cy="13" r="3.2" fill="#f1c40f"/>
  <circle cx="37" cy="18" r="3.2" fill="#2ecc71"/>
  <circle cx="39" cy="26" r="3.2" fill="#3498db"/>
  <circle cx="21" cy="39" r="3" fill="#9b59b6"/>
  <circle cx="13" cy="34" r="3" fill="#1abc9c"/>
  <circle cx="10" cy="25" r="3" fill="#34495e"/>
  <!-- Paintbrush crossing -->
  <g transform="rotate(42 24 24)">
    <!-- Wooden Handle -->
    <path d="M 22 -4 L 26 -4 L 25 32 L 23 32 Z" fill="#b86b29" stroke="#7a3f0e" stroke-width="0.7"/>
    <!-- Metal Ferrule -->
    <rect x="22.5" y="32" width="3" height="7" fill="url(#brushMetal)" stroke="#444" stroke-width="0.5"/>
    <!-- Bristles -->
    <path d="M 22.5 39 C 22.5 45, 23 47, 24 48 C 25 47, 25.5 45, 25.5 39 Z" fill="#222"/>
    <!-- Wet Tip -->
    <path d="M 23 45 C 23.5 47, 24 48, 24 48 C 24 48, 24.5 47, 25 45 Z" fill="#e74c3c"/>
  </g>
</svg>

