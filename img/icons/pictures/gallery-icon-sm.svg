<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="skyGradSm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2074e0"/>
      <stop offset="100%" stop-color="#b8e0ff"/>
    </linearGradient>
    <linearGradient id="hillGradSm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#50cc20"/>
      <stop offset="100%" stop-color="#186408"/>
    </linearGradient>
  </defs>

  <!-- Photo slide -->
  <rect x="2" y="3" width="18" height="18" rx="1.5" fill="#ffffff" stroke="#7898b8" stroke-width="0.8"/>
  <rect x="3.5" y="4.5" width="15" height="12" fill="url(#skyGradSm)"/>
  
  <!-- Sun -->
  <circle cx="7" cy="7.5" r="2" fill="#ffcc00"/>
  
  <!-- Hill -->
  <path d="M 3.5 13 Q 8 10 12 12 Q 15 14 18.5 11 L 18.5 16.5 L 3.5 16.5 Z" fill="url(#hillGradSm)"/>
  
  <!-- Lens / Magnifier -->
  <path d="M 16 16 L 22 22" stroke="#604018" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="14" cy="14" r="4.5" fill="#4080e0" fill-opacity="0.3" stroke="#285090" stroke-width="1.2"/>
  <circle cx="14" cy="14" r="3.5" fill="none" stroke="#ffffff" stroke-width="0.8"/>
</svg>

