<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Shadow filter -->
    <filter id="xp-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-color="#001830" flood-opacity="0.35"/>
    </filter>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#186cd9"/>
      <stop offset="45%" stop-color="#4a9bee"/>
      <stop offset="85%" stop-color="#a4d4ff"/>
      <stop offset="100%" stop-color="#d6edff"/>
    </linearGradient>
    <!-- Hill gradient -->
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48c418"/>
      <stop offset="60%" stop-color="#2d9410"/>
      <stop offset="100%" stop-color="#186008"/>
    </linearGradient>
    <!-- Back hill gradient -->
    <linearGradient id="hillBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#62d828"/>
      <stop offset="100%" stop-color="#349c12"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff266"/>
      <stop offset="75%" stop-color="#ffb818"/>
      <stop offset="100%" stop-color="#ff9000"/>
    </radialGradient>
    <!-- Magnifier glass reflection -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#90c8ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4080e0" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Frame gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="90%" stop-color="#f2f5f9"/>
      <stop offset="100%" stop-color="#d8e0ea"/>
    </linearGradient>
  </defs>

  <!-- Group with shadow -->
  <g filter="url(#xp-shadow)">
    <!-- Back tilt photo / slide -->
    <rect x="7" y="5" width="33" height="33" rx="2.5" fill="#e6edf5" stroke="#90a8c0" stroke-width="0.8" transform="rotate(-6 23 21)"/>
    <rect x="9" y="7" width="29" height="23" fill="#8cbde8" transform="rotate(-6 23 21)" opacity="0.6"/>

    <!-- Front primary photo frame -->
    <rect x="5" y="8" width="34" height="34" rx="2.5" fill="url(#frameGrad)" stroke="#7898b8" stroke-width="1"/>
    <!-- Photo inner area border -->
    <rect x="7.5" y="10.5" width="29" height="23" fill="none" stroke="#2a5080" stroke-width="0.75" stroke-opacity="0.3"/>
    
    <!-- Photo image content (Clipped to inner area) -->
    <g>
      <clipPath id="photoClip">
        <rect x="8" y="11" width="28" height="22" rx="1"/>
      </clipPath>
      <g clip-path="url(#photoClip)">
        <!-- Sky -->
        <rect x="8" y="11" width="28" height="22" fill="url(#skyGrad)"/>
        
        <!-- Radiant Sun -->
        <circle cx="16" cy="17" r="4.5" fill="url(#sunGlow)"/>

        <!-- Soft Cloud -->
        <path d="M 23 16 Q 24.5 14 27 15 Q 29 13.5 31.5 15 Q 33.5 15 34 16.5 Q 34.5 18 33 18.5 L 23 18.5 Z" fill="#ffffff" opacity="0.85"/>

        <!-- Back Distant Hill -->
        <ellipse cx="28" cy="27" rx="14" ry="7" fill="url(#hillBackGrad)"/>

        <!-- Front Bliss Rolling Green Hill -->
        <path d="M 8 23 Q 16 19 23 23 Q 30 27 36 22 L 36 33 L 8 33 Z" fill="url(#hillGrad)"/>
      </g>
    </g>

    <!-- Photo paper bottom border line detail -->
    <line x1="8" y1="36" x2="36" y2="36" stroke="#c0d0e0" stroke-width="0.7"/>
    <circle cx="22" cy="38.5" r="1.2" fill="#a0b4cc"/>
  </g>

  <!-- XP Classic Magnifying Glass / Camera Viewer lens icon in bottom right -->
  <g filter="url(#xp-shadow)">
    <!-- Handle -->
    <path d="M 32 32 L 42 42" stroke="#503010" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 32 32 L 42 42" stroke="#b08040" stroke-width="3" stroke-linecap="round"/>
    <path d="M 32.5 32.5 L 41.5 41.5" stroke="#f0c880" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Lens Rim -->
    <circle cx="28" cy="28" r="8" fill="#183868" stroke="#4a70a0" stroke-width="1.8"/>
    <circle cx="28" cy="28" r="6.8" fill="url(#glassReflect)" stroke="#cce4ff" stroke-width="1"/>
    
    <!-- Lens Highlight Crescent -->
    <path d="M 23.5 25 A 5 5 0 0 1 31 22.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>
</svg>

