<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Portfolio</title>
  <meta name="description" content="A modern desktop operating system portfolio experience featuring interactive apps, projects, and skills.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="desktop-screen" id="desktop">

  <!-- Desktop Surface Canvas -->
  <main class="desktop-canvas" id="desktopCanvas" aria-label="Desktop Surface">

    <!-- Desktop Icons Grid (2 Columns on the Left matching reference image) -->
    <div class="desktop-grid" id="desktopGrid" role="list" aria-label="Desktop Applications">
      
      <!-- COLUMN 1: Computer, Resume, Skills, Gallery, Playground, Recycle Bin -->
      <div class="desktop-icon-col">
        
        <!-- Computer -->
        <button class="desktop-icon" id="appComputer" data-app="computer" role="listitem" tabindex="0" aria-label="Computer - About Me">
          <div class="icon-visual">
            <svg viewBox="0 0 48 48" width="48" height="48">
              <defs>
                <linearGradient id="pcScreen" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#00adef"/>
                  <stop offset="100%" stop-color="#0066cc"/>
                </linearGradient>
                <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#0080ff"/>
                  <stop offset="60%" stop-color="#0055bb"/>
                  <stop offset="100%" stop-color="#003388"/>
                </linearGradient>
                <linearGradient id="caseGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#f8fafc"/>
                  <stop offset="100%" stop-color="#cbd5e1"/>
                </linearGradient>
              </defs>
              <ellipse cx="24" cy="43" rx="19" ry="3.5" fill="#000" opacity="0.4"/>
              <!-- Tower case on the left -->
              <rect x="5" y="16" width="9" height="24" rx="1.5" fill="url(#towerGrad)" stroke="#1e293b" stroke-width="0.8"/>
              <rect x="7" y="19" width="5" height="1.5" fill="#93c5fd"/>
              <circle cx="9.5" cy="35" r="1.2" fill="#22c55e"/>
              <!-- Monitor in center -->
              <rect x="15" y="8" width="28" height="23" rx="2" fill="url(#caseGrad)" stroke="#64748b" stroke-width="1"/>
              <rect x="17" y="10" width="24" height="17" rx="1" fill="url(#pcScreen)" stroke="#0284c7" stroke-width="0.8"/>
              <circle cx="29" cy="18" r="3.5" fill="#ffffff" opacity="0.9"/>
              <!-- Stand & Base -->
              <path d="M26 31h6l1 4h-8z" fill="#94a3b8" stroke="#64748b" stroke-width="0.8"/>
              <rect x="22" y="35" width="14" height="2" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>
              <!-- Keyboard -->
              <polygon points="12,38 38,38 37,42 11,42" fill="url(#caseGrad)" stroke="#94a3b8" stroke-width="0.8"/>
              <line x1="14" y1="40" x2="35" y2="40" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 1"/>
              <!-- Mouse -->
              <ellipse cx="41" cy="40.5" rx="2.2" ry="1.4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.6"/>
            </svg>
          </div>
          <span class="icon-title">Computer</span>
          <span class="icon-sub">About Me</span>
        </button>

        <!-- Resume -->
        <button class="desktop-icon" id="appResume" data-app="resume" role="listitem" tabindex="0" aria-label="Resume - Download">
          <div class="icon-visual">
            <svg viewBox="0 0 48 48" width="48" height="48">
              <defs>
                <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="100%" stop-color="#f1f5f9"/>
                </linearGradient>
              </defs>
              <rect x="11" y="8" width="28" height="34" rx="2" fill="#000" opacity="0.3"/>
              <path d="M10 6h18l10 10v24a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" fill="url(#docGrad)" stroke="#cbd5e1" stroke-width="1"/>
              <path d="M28 6v10h10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
              <line x1="14" y1="12" x2="24" y2="12" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
              <line x1="14" y1="16" x2="26" y2="16" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="14" y1="20" x2="26" y2="20" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="12" y="24" width="24" height="11" rx="2" fill="#ef4444"/>
              <text x="24" y="32.5" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="8" text-anchor="middle" letter-spacing="0.5">PDF</text>
              <line x1="14" y1="38" x2="30" y2="38" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="icon-title">Resume</span>
          <span class="icon-sub">Download</span>
        </button>

        <!-- Skills -->
        <button class="desktop-icon" id="appSkills" data-app="skills" role="listitem" tabindex="0" aria-label="Skills - Tech Stack">
          <div class="icon-visual">
            <svg viewBox="0 0 48 48" width="48" height="48">
              <defs>
                <linearGradient id="termTitleBar" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#e2e8f0"/>
                  <stop offset="100%" stop-color="#94a3b8"/>
                </linearGradient>
              </defs>
              <rect x="7" y="11" width="36" height="29" rx="3" fill="#000" opacity="0.35"/>
              <rect x="6" y="9" width="36" height="28" rx="3" fill="#0a0a0c" stroke="#475569" stroke-width="1.2"/>
              <path d="M6 12a3 3 0 0 1 3-3h30a3 3 0 0 1 3 3v4H6v-4z" fill="url(#termTitleBar)"/>
              <circle cx="10.5" cy="13" r="1.4" fill="#ef4444"/>
              <circle cx="15" cy="13" r="1.4" fill="#f59e0b"/>
              <circle cx="19.5" cy="13" r="1.4" fill="#10b981"/>
              <text x="11" y="27" fill="#ffffff" font-family="'Fira Code', Consolas, monospace" font-weight="bold" font-size="12">&gt; _</text>
            </svg>
          </div>
          <span class="icon-title">Skills</span>
          <span class="icon-sub">Tech Stack</span>
        </button>

        <!-- Gallery -->
        <button class="desktop-icon" id="appGallery" data-app="gallery" role="listitem" tabindex="0" aria-label="Gallery - Snapshots">
          <div class="icon-visual">
            <svg viewBox="0 0 48 48" width="48" height="48">
              <defs>
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#38bdf8"/>
                  <stop offset="100%" stop-color="#0284c7"/>
                </linearGradient>
              </defs>
              <rect x="8" y="10" width="34" height="30" rx="3" fill="#000" opacity="0.35"/>
              <rect x="7" y="9" width="34" height="30" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
              <rect x="10" y="12" width="28" height="24" fill="url(#skyGrad)"/>
              <circle cx="30" cy="17" r="3.2" fill="#f97316"/>
              <polygon points="10,36 19,25 26,33 38,20 38,36" fill="#475569"/>
              <polygon points="13,36 22,27 28,34 38,24 38,36" fill="#334155" opacity="0.9"/>
            </svg>
          </div>
          <span class="icon-title">Gallery</span>
          <span class="icon-sub">Snapshots</span>
        </button>

        <!-- Playground -->
        <button class="desktop-icon" id="appPlayground" data-app="playground" role="listitem" tabindex="0" aria-label="Playground - Side Projects">
          <div class="icon-visual">
            <svg viewBox="0 0 48 48" width="48" height="48">
              <defs>
                <linearGradient id="padBody" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="100%" stop-color="#cbd5e1"/>
                </linearGradient>
              </defs>
              <ellipse cx="24" cy="40" rx="17" ry="4" fill="#000" opacity="0.4"/>
              <path d="M12 18c-4 0-7 5-7 12 0 4 3 8 7 7l4-4h16l4 4c4 1 7-3 7-7 0-7-3-12-7-12H12z" fill="url(#padBody)" stroke="#94a3b8" stroke-width="1.2"/>
              <line x1="24" y1="18" x2="24" y2="14" stroke="#64748b" stroke-width="2"/>
              <rect x="11.5" y="24" width="7" height="2.8" rx="0.8" fill="#1e293b"/>
              <rect x="13.6" y="21.9" width="2.8" height="7" rx="0.8" fill="#1e293b"/>
              <circle cx="19" cy="30" r="3.2" fill="#334155" stroke="#1e293b" stroke-width="0.8"/>
              <circle cx="29" cy="30" r="3.2" fill="#334155" stroke="#1e293b" stroke-width="0.8"/>
              <circle cx="34" cy="22" r="1.6" fill="#ef4444"/>
              <circle cx="31.5" cy="24.5" r="1.6" fill="#3b82f6"/>
              <circle cx="36.5" cy="24.5" r="1.6" fill="#10b981"/>
              <circle cx="34" cy="27" r="1.6" fill="#facc15"/>
            </svg>
          </div>
          <span class="icon-title">Playground</span>
          <span class="icon-sub">Side Projects</span>
        </button>

        <!-- Recycle Bin -->
        <button class="desktop-icon" id="appRecycle" data-app="recycle" role="listitem" tabindex="0" aria-label="Recycle Bin">
          <div class="icon-visual">
            <svg viewBox="0 0 48 48" width="48" height="48">
              <defs>
                <linearGradient id="binGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#e0f2fe"/>
                  <stop offset="100%" stop-color="#bae6fd"/>
                </linearGradient>
              </defs>
              <ellipse cx="24" cy="43" rx="12" ry="3" fill="#000" opacity="0.4"/>
              <path d="M13 15h22l-3 25a3 3 0 0 1-3 2.5H19a3 3 0 0 1-3-2.5L13 15z" fill="url(#binGrad)" opacity="0.85" stroke="#38bdf8" stroke-width="1.2"/>
              <ellipse cx="24" cy="15" rx="11" ry="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
              <path d="M19 15c0-3 3-5 5-3 2-2 5 0 5 3-1 2-2 4-5 3-2 1-4-1-5-3z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
              <g transform="translate(17, 24) scale(0.9)" fill="#0078d7">
                <path d="M7 1l2.5 3.5H7.5v2.5h-1V4.5H4.5L7 1z"/>
                <path d="M13.5 11.5l-3.5 2.5v-2H7.5v-1h2.5V9l3.5 2.5z"/>
                <path d="M2.5 14l1-4.2 1.8 1.8 1.8-1 0.5 0.9-1.8 1 1.8 1.8L2.5 14z"/>
              </g>
            </svg>
          </div>
          <span class="icon-title">Recycle Bin</span>
        </button>
      </div>

      <!-- COLUMN 2: Projects, Experience, Chess, Blog, Contact -->
      <div class="desktop-icon-col">
        
        <!-- Projects -->
        <button class="desktop-icon" id="appProjects" data-app="projects" role="listitem" tabindex="0" aria-label="Projects - My Work">
          <div class="icon-visual">
            <svg viewBox="0 0 48 48" width="48" height="48">
              <defs>
                <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#f59e0b"/>
                  <stop offset="100%" stop-color="#d97706"/>
                </linearGradient>
                <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#fbbf24"/>
                  <stop offset="100%" stop-color="#d97706"/>
                </linearGradient>
              </defs>
              <ellipse cx="24" cy="42" rx="18" ry="3.5" fill="#000" opacity="0.35"/>
              <path d="M6 14a2 2 0 0 1 2-2h12l3 3h17a2 2 0 0 1 2 2v19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V14z" fill="url(#folderBack)" stroke="#b45309" stroke-width="1"/>
              <rect x="10" y="15" width="28" height="18" rx="1.5" fill="#ffffff" opacity="0.95"/>
              <rect x="14" y="13" width="7" height="4" rx="1" fill="#0284c7"/>
              <path d="M5 20h38l-4 17a2.5 2.5 0 0 1-2.5 2H11.5a2.5 2.5 0 0 1-2.5-2L5 20z" fill="url(#folderFront)" stroke="#b45309" stroke-width="1"/>
            </svg>
          </div>
          <span class="icon-title">Projects</span>
          <span class="icon-sub">My Work</span>
        </button>

        <!-- Experience -->
        <button class="desktop-icon" id="appExperience" data-app="experience" role="listitem" tabindex="0" aria-label="Experience - My Journey">
          <div class="icon-visual">
            <svg viewBox="0 0 48 48" width="48" height="48">
              <defs>
                <radialGradient id="globeGrad" cx="35%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#38bdf8"/>
                  <stop offset="45%" stop-color="#0284c7"/>
                  <stop offset="90%" stop-color="#034694"/>
                  <stop offset="100%" stop-color="#0f172a"/>
                </radialGradient>
              </defs>
              <ellipse cx="24" cy="42" rx="14" ry="3.5" fill="#000" opacity="0.35"/>
              <circle cx="24" cy="24" r="17" fill="url(#globeGrad)"/>
              <path d="M13 18c1-3 5-5 8-3 2 1 2 4 4 4 3 0 4-2 6 0 2 2 1 5-1 6-2 1-3 1-4 3-1 3-2 5-5 5-3 0-5-3-6-6-2-4-3-6-2-9z" fill="#22c55e"/>
              <path d="M26 31c3 0 5 3 6 5-3 2-6 2-8 2 0-3 1-7 2-7z" fill="#22c55e"/>
              <path d="M12 14a15 15 0 0 1 20-3c-9 1-16 8-19 17-1-5-1-10-1-14z" fill="#ffffff" opacity="0.45"/>
              <circle cx="24" cy="24" r="17" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.6"/>
            </svg>
          </div>
          <span class="icon-title">Experience</span>
          <span class="icon-sub">My Journey</span>
        </button>

        <!-- Chess -->
        <button class="desktop-icon" id="appChess" data-app="chess" role="listitem" tabindex="0" aria-label="Chess - Play a Game">
          <div class="icon-visual">
            <svg viewBox="0 0 48 48" width="48" height="48">
              <defs>
                <linearGradient id="knightGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="70%" stop-color="#e2e8f0"/>
                  <stop offset="100%" stop-color="#94a3b8"/>
                </linearGradient>
                <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#334155"/>
                  <stop offset="100%" stop-color="#0f172a"/>
                </linearGradient>
              </defs>
              <ellipse cx="24" cy="42" rx="13" ry="3.5" fill="#000" opacity="0.45"/>
              <path d="M12 38h24v4H12z" rx="1.5" fill="url(#baseGrad)" stroke="#1e293b" stroke-width="1"/>
              <path d="M15 35h18v3H15z" fill="#475569"/>
              <path d="M16 35c0-5 2-8 3-10-1-1-3-3-3-6 0-4 3-7 8-7 4 0 7 2 8 5 1 2 2 5 2 9 0 4-2 7-5 9H16z" fill="url(#knightGrad)" stroke="#64748b" stroke-width="1"/>
              <circle cx="21" cy="17" r="1.5" fill="#1e293b"/>
              <path d="M18 22l4 1-3 3" fill="none" stroke="#64748b" stroke-width="1.2"/>
              <path d="M26 14c1 1 2 3 2 5M28 19c1 1 2 3 2 5" stroke="#94a3b8" stroke-width="1.5"/>
            </svg>
          </div>
          <span class="icon-title">Chess</span>
          <span class="icon-sub">Play a Game</span>
        </button>

        <!-- Blog -->
        <button class="desktop-icon" id="appBlog" data-app="blog" role="listitem" tabindex="0" aria-label="Blog - My Thoughts">
          <div class="icon-visual">
            <svg viewBox="0 0 48 48" width="48" height="48">
              <defs>
                <linearGradient id="padGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="100%" stop-color="#f1f5f9"/>
                </linearGradient>
              </defs>
              <rect x="11" y="9" width="26" height="33" rx="2" fill="#000" opacity="0.3"/>
              <rect x="10" y="8" width="26" height="32" rx="2" fill="url(#padGrad)" stroke="#cbd5e1" stroke-width="1"/>
              <g fill="#475569">
                <circle cx="14" cy="8" r="1.4"/>
                <circle cx="18" cy="8" r="1.4"/>
                <circle cx="22" cy="8" r="1.4"/>
                <circle cx="26" cy="8" r="1.4"/>
                <circle cx="30" cy="8" r="1.4"/>
              </g>
              <line x1="14" y1="15" x2="31" y2="15" stroke="#93c5fd" stroke-width="1"/>
              <line x1="14" y1="19" x2="31" y2="19" stroke="#93c5fd" stroke-width="1"/>
              <line x1="14" y1="23" x2="31" y2="23" stroke="#93c5fd" stroke-width="1"/>
              <line x1="14" y1="27" x2="31" y2="27" stroke="#93c5fd" stroke-width="1"/>
              <line x1="14" y1="31" x2="31" y2="31" stroke="#93c5fd" stroke-width="1"/>
              <g transform="translate(20, 11) rotate(35)">
                <rect x="0" y="0" width="5.5" height="4" rx="0.8" fill="#f43f5e"/>
                <rect x="0" y="4" width="5.5" height="1.8" fill="#cbd5e1"/>
                <rect x="0" y="5.8" width="5.5" height="17" fill="#facc15" stroke="#ca8a04" stroke-width="0.6"/>
                <polygon points="0,22.8 5.5,22.8 2.75,27.5" fill="#fed7aa"/>
                <polygon points="1.8,25.8 3.7,25.8 2.75,27.5" fill="#1e293b"/>
              </g>
            </svg>
          </div>
          <span class="icon-title">Blog</span>
          <span class="icon-sub">My Thoughts</span>
        </button>

        <!-- Contact -->
        <button class="desktop-icon" id="appContact" data-app="contact" role="listitem" tabindex="0" aria-label="Contact - Let's Talk">
          <div class="icon-visual">
            <svg viewBox="0 0 48 48" width="48" height="48">
              <defs>
                <radialGradient id="gearGrad" cx="35%" cy="35%" r="70%">
                  <stop offset="0%" stop-color="#cbd5e1"/>
                  <stop offset="50%" stop-color="#64748b"/>
                  <stop offset="100%" stop-color="#334155"/>
                </radialGradient>
                <radialGradient id="gearHub" cx="35%" cy="35%" r="70%">
                  <stop offset="0%" stop-color="#94a3b8"/>
                  <stop offset="100%" stop-color="#1e293b"/>
                </radialGradient>
              </defs>
              <circle cx="25" cy="25" r="17" fill="#000" opacity="0.4"/>
              <g fill="url(#gearGrad)" stroke="#1e293b" stroke-width="0.8">
                <path d="M21 7h6v5h-6zM21 36h6v5h-6zM7 21h5v6H7zM36 21h5v6h-5z"/>
                <g transform="rotate(45 24 24)">
                  <path d="M21 7h6v5h-6zM21 36h6v5h-6zM7 21h5v6H7zM36 21h5v6h-5z"/>
                </g>
                <circle cx="24" cy="24" r="15"/>
              </g>
              <circle cx="24" cy="24" r="9" fill="url(#gearHub)" stroke="#1e293b" stroke-width="1"/>
              <circle cx="24" cy="24" r="4.5" fill="#0f172a"/>
            </svg>
          </div>
          <span class="icon-title">Contact</span>
          <span class="icon-sub">Let's Talk</span>
      </div>

    </div>

    <!-- Drag Selection Marquee Box -->
    <div class="selection-box" id="selectionBox" hidden></div>

    <!-- Active Window Containers -->
    <div class="windows-container" id="windowsContainer"></div>

  </main>

  <!-- Modern Windows 11 Start Menu Flyout -->
  <aside class="modern-start-menu" id="modernStartMenu" hidden aria-label="Start Menu">
    <div class="start-search-box">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
      </svg>
      <input type="text" id="startMenuSearch" placeholder="Type here to search..." autocomplete="off">
    </div>

    <div class="start-section-header">
      <span>Pinned Applications</span>
    </div>

    <div class="start-pinned-grid">
      <button class="start-app-item" data-app="computer">
        <div class="start-app-icon">💻</div>
        <span>About Me</span>
      </button>
      <button class="start-app-item" data-app="projects">
        <div class="start-app-icon">📁</div>
        <span>Projects</span>
      </button>
      <button class="start-app-item" data-app="resume">
        <div class="start-app-icon">📄</div>
        <span>Resume</span>
      </button>
      <button class="start-app-item" data-app="skills">
        <div class="start-app-icon">⚡</div>
        <span>Skills</span>
      </button>
      <button class="start-app-item" data-app="experience">
        <div class="start-app-icon">🌐</div>
        <span>Experience</span>
      </button>
      <button class="start-app-item" data-app="chess">
        <div class="start-app-icon">♟️</div>
        <span>Chess</span>
      </button>
      <button class="start-app-item" data-app="gallery">
        <div class="start-app-icon">🖼️</div>
        <span>Gallery</span>
      </button>
      <button class="start-app-item" data-app="blog">
        <div class="start-app-icon">📝</div>
        <span>Blog</span>
      </button>
      <button class="start-app-item" data-app="playground">
        <div class="start-app-icon">🎮</div>
        <span>Playground</span>
      </button>
      <button class="start-app-item" data-app="contact">
        <div class="start-app-icon">⚙️</div>
        <span>Contact</span>
      </button>
    </div>

    <div class="start-footer">
      <div class="user-profile">
        <div class="user-avatar">👨‍💻</div>
        <div class="user-details">
          <span class="user-name">Developer Portfolio</span>
          <span class="user-role">Full Stack &amp; AI Engineer</span>
        </div>
      </div>
      <button class="power-btn" id="startPowerBtn" title="Power Options" aria-label="Power">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Modern Windows 11 Glassmorphism Taskbar (Fixed Bottom) -->
  <footer class="modern-taskbar" id="modernTaskbar" role="navigation" aria-label="Taskbar">
    
    <!-- Left Section: Windows 11 Start + Search + Pinned Apps -->
    <div class="taskbar-left-group">
      
      <!-- Windows 11 Start Button -->
      <button class="win11-start-btn" id="win11StartBtn" aria-label="Start Menu" aria-expanded="false" title="Start">
        <div class="win11-logo">
          <span class="win11-tile"></span>
          <span class="win11-tile"></span>
          <span class="win11-tile"></span>
          <span class="win11-tile"></span>
        </div>
      </button>

      <!-- Windows 11 Pill Search Bar -->
      <div class="win11-search-bar" id="win11SearchBar">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="#94a3b8">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
        </svg>
        <input type="text" id="taskbarSearchInput" placeholder="Search" aria-label="Search apps and files">
      </div>

      <!-- Pinned Taskbar Apps (from screenshot: Explorer, Edge, Terminal, Spotify, Settings) -->
      <div class="taskbar-pinned-apps">
        
        <!-- Pinned 1: File Explorer (Projects) -->
        <button class="taskbar-app-btn" data-app="projects" title="File Explorer — Projects" aria-label="Projects">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M3 6h7l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z" fill="#eab308"/>
            <path d="M2 10h20l-1.5 9a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1L2 10z" fill="#facc15"/>
            <rect x="8" y="11" width="8" height="4" rx="1" fill="#0284c7" opacity="0.8"/>
          </svg>
        </button>

        <!-- Pinned 2: Edge Browser (Gallery / Web) -->
        <button class="taskbar-app-btn" data-app="gallery" title="Browser — Showcase" aria-label="Browser">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <circle cx="12" cy="12" r="10" fill="#0ea5e9"/>
            <path d="M4 12c3-4 8-4 12-1 3 2 4 6 2 9-2-3-6-5-10-4-2 0-3-2-4-4z" fill="#38bdf8"/>
            <path d="M12 4c4 3 6 8 4 12-2 3-5 5-9 4 2-1 4-4 4-7 0-3-1-6-3-8 1-.5 2.5-1 4-1z" fill="#22c55e" opacity="0.9"/>
          </svg>
        </button>

        <!-- Pinned 3: Terminal (Skills) -->
        <button class="taskbar-app-btn" data-app="skills" title="Terminal — Tech Stack" aria-label="Terminal">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <rect x="2" y="4" width="20" height="16" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
            <path d="M6 9l4 3-4 3" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="12" y1="15" x2="17" y2="15" stroke="#10b981" stroke-width="2"/>
          </svg>
        </button>

        <!-- Pinned 4: Spotify (Lofi ambient player) -->
        <button class="taskbar-app-btn" id="taskbarSpotifyBtn" data-app="spotify" title="Spotify — Music" aria-label="Spotify Music Player">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <circle cx="12" cy="12" r="10" fill="#1db954"/>
            <path d="M7 9.5c3.5-1 7.5-.5 10 1" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M7.5 12.5c3-.8 6.5-.4 9 .8" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M8 15.5c2.5-.6 5.5-.3 7.5.6" fill="none" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- Pinned 5: Settings (Contact & Preferences) -->
        <button class="taskbar-app-btn" data-app="contact" title="Settings — Contact &amp; Options" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <circle cx="12" cy="12" r="8" fill="#64748b"/>
            <circle cx="12" cy="12" r="3.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5" stroke="#94a3b8" stroke-width="2"/>
          </svg>
        </button>

      </div>

      <!-- Active Running Window Tabs Container -->
      <div class="taskbar-active-tabs" id="taskbarActiveTabs"></div>

    </div>

    <!-- Right Section: Modern System Tray -->
    <div class="taskbar-right-tray" id="modernSystemTray" role="region" aria-label="System Tray">
      
      <!-- Caret / Hidden Icons -->
      <button class="tray-btn" id="trayModernChevron" title="Show hidden icons" aria-label="Hidden icons">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 10l4-4 4 4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Network / Wi-Fi Icon -->
      <button class="tray-btn" id="trayWifiBtn" title="Wi-Fi: Connected (Internet Access)" aria-label="Network">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 18a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
          <path d="M7.76 15.66a6 6 0 0 1 8.48 0 .75.75 0 0 0 1.06-1.06 7.5 7.5 0 0 0-10.6 0 .75.75 0 0 0 1.06 1.06z"/>
          <path d="M4.93 12.83a10 10 0 0 1 14.14 0 .75.75 0 0 0 1.06-1.06 11.5 11.5 0 0 0-16.26 0 .75.75 0 1 0 1.06 1.06z"/>
        </svg>
      </button>

      <!-- Volume Icon -->
      <button class="tray-btn" id="trayModernVolumeBtn" title="Speakers: 80%" aria-label="Volume">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M13.5 4.06c0-1.33-1.61-2-2.56-1.06L6.88 7.06H4a2 2 0 0 0-2 2v5.88a2 2 0 0 0 2 2h2.88l4.06 4.06c.95.95 2.56.28 2.56-1.06V4.06zM17.5 12c0-2.07-1.19-3.86-2.92-4.72a1 1 0 1 0-.9 1.79c1.08.54 1.82 1.66 1.82 2.93s-.74 2.39-1.82 2.93a1 1 0 1 0 .9 1.79C16.31 15.86 17.5 14.07 17.5 12zm2.5 0c0 3.42-1.97 6.38-4.83 7.8a1 1 0 1 0 .9 1.79C19.54 19.86 22 16.22 22 12s-2.46-7.86-5.93-9.59a1 1 0 1 0-.9 1.79C18.03 5.62 20 8.58 20 12z"/>
        </svg>
      </button>

      <!-- Battery Icon -->
      <button class="tray-btn" id="trayBatteryBtn" title="Battery: 100% Fully Charged" aria-label="Battery">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="7" width="17" height="10" rx="2.5"/>
          <path d="M21 10.5v3" stroke-linecap="round"/>
          <rect x="4.5" y="9.5" width="12" height="5" rx="1" fill="#22c55e" stroke="none"/>
        </svg>
      </button>

      <!-- Modern Two-Line Digital Time & Date -->
      <div class="modern-tray-clock" id="modernTrayClock" role="timer" title="Open Calendar &amp; Notification Center">
        <span class="modern-clock-time" id="modernClockTime">10:24 PM</span>
        <span class="modern-clock-date" id="modernClockDate">26 Oct 2026</span>
      </div>

    </div>

  </footer>

  <!-- Right-Click Desktop Context Menu -->
  <nav class="modern-context-menu" id="modernContextMenu" hidden aria-label="Context Menu">
    <div class="menu-item" data-action="refresh">
      <span>🔄 Refresh</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="open-all">
      <span>📂 Open All Work</span>
    </div>
    <div class="menu-item" data-action="switch-wallpaper">
      <span>🌄 Toggle Wallpaper</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="properties">
      <span>⚙️ Display Properties</span>
    </div>
  </nav>

  <script src="js/main.js"></script>
</body>
</html>
