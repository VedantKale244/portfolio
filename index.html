    <style id="xp-desktop-fouc-guard">
      section.absolute.top-0.left-0 button {
        opacity: 1 !important;
        visibility: visible !important;
      }
      button.xp-app-deleted {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }
    
      /* Windows XP Volume Icon & Modal Enhancements */
      img[src*="volume-icon-sm"], img[src*="mute-icon-sm"] {
        cursor: pointer !important;
        padding: 3px !important;
        margin: -3px 0 !important;
        box-sizing: content-box !important;
        border-radius: 2px !important;
        transition: background 0.15s ease;
      }
      img[src*="volume-icon-sm"]:hover, img[src*="mute-icon-sm"]:hover {
        background: rgba(255, 255, 255, 0.25) !important;
      }
      img[src*="volume-icon-sm"]:active, img[src*="mute-icon-sm"]:active {
        background: rgba(0, 0, 0, 0.2) !important;
      }
      section.bg-window-blue-deactivated {
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.45) !important;
        border: 1px solid #0055ea !important;
        z-index: 1000000 !important;
      }
    </style>

    <script>
      // Ensure English is selected by default, volume is audible, and suppress old static clippy modal
      localStorage.setItem('currentLocale', 'en');
      localStorage.setItem('clippyDismissed', 'true');
      if (!localStorage.getItem('volume') || parseFloat(localStorage.getItem('volume')) === 0) {
        localStorage.setItem('volume', '0.5');
      }

      // Ensure zero windows auto-open on page load/refresh & purge stale test positions
      try {
        localStorage.removeItem('windows');
        sessionStorage.removeItem('windows');
        localStorage.removeItem('openWindowIds');
        sessionStorage.removeItem('openWindowIds');
        sessionStorage.setItem('xp_portfolio_session_active', 'true');

        // Clean out any bad/overlapping test coordinates
        const clk = JSON.parse(localStorage.getItem('xp_clock_pos') || 'null');
        if (clk && (clk.left === 480 || (typeof clk.left === 'number' && clk.left < 750))) {
          localStorage.removeItem('xp_clock_pos');
        }
        const cal = JSON.parse(localStorage.getItem('xp_cal_pos') || 'null');
        if (cal && (cal.left === 480 || (typeof cal.left === 'number' && cal.left < 750))) {
          localStorage.removeItem('xp_cal_pos');
        }
        const st = JSON.parse(localStorage.getItem('xp_sticky_pos') || 'null');
        if (st && st.left === 720) {
          localStorage.removeItem('xp_sticky_pos');
        }
      } catch (e) {}
    </script>
