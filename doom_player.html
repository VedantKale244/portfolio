<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DOOM (1993)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }
    #jsdos-container,
    .dosbox-container {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: #000000 !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #jsdos,
    .dosbox-container canvas,
    canvas {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain !important;
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
      display: block !important;
      margin: auto !important;
    }
    .dosbox-overlay,
    .dosbox-powered,
    .dosbox-loader {
      display: none !important;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #050000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
    }
    .doom-title {
      font-size: 28px;
      font-weight: bold;
      color: #ffcc00;
      text-shadow: 2px 2px 0 #cc0000;
      letter-spacing: 2px;
      font-family: 'Courier New', Courier, monospace;
    }
    .doom-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #440000;
      border-top-color: #ff3333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .doom-status {
      font-size: 13px;
      color: #aaaaaa;
      font-family: monospace;
    }
  </style>
  <script src="/assets/dos/js-dos.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="doom-title">🔥 DOOM (1993)</div>
    <div class="doom-spinner" id="spinner"></div>
    <div class="doom-status" id="status">Extracting DOOM executable and WAD...</div>
  </div>

  <div id="jsdos-container">
    <canvas id="jsdos"></canvas>
  </div>

  <script>
    (function () {
      const statusEl = document.getElementById("status");
      const overlayEl = document.getElementById("loading-overlay");

      if (typeof Dos === "undefined") {
        statusEl.innerHTML = "Error: JS-DOS could not be loaded.";
        return;
      }

      let dosCI = null;

      window.addEventListener("beforeunload", function () {
        if (dosCI && typeof dosCI.exit === "function") {
          try { dosCI.exit(); } catch (e) {}
        }
      });

      function enforceCanvasScaling() {
        const container = document.querySelector('.dosbox-container') || document.getElementById('jsdos-container');
        if (container) {
          container.style.setProperty("width", "100%", "important");
          container.style.setProperty("height", "100%", "important");
          container.style.setProperty("position", "absolute", "important");
          container.style.setProperty("top", "0", "important");
          container.style.setProperty("left", "0", "important");
          container.style.setProperty("display", "flex", "important");
          container.style.setProperty("align-items", "center", "important");
          container.style.setProperty("justify-content", "center", "important");
        }
        const canvasList = document.querySelectorAll("canvas");
        canvasList.forEach(c => {
          c.style.setProperty("width", "100%", "important");
          c.style.setProperty("height", "100%", "important");
          c.style.setProperty("max-width", "100%", "important");
          c.style.setProperty("max-height", "100%", "important");
          c.style.setProperty("object-fit", "contain", "important");
          c.style.setProperty("image-rendering", "pixelated", "important");
          c.style.setProperty("display", "block", "important");
          c.style.setProperty("margin", "auto", "important");
        });
      }

      window.addEventListener("resize", enforceCanvasScaling);

      const scaleObserver = new MutationObserver(enforceCanvasScaling);
      scaleObserver.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["style", "width", "height"] });

      Dos(document.getElementById("jsdos"), {
        wdosboxUrl: "/assets/dos/wdosbox.js",
        cycles: "fixed 25000",
        autolock: false
      }).ready(function (fs, main) {
        statusEl.textContent = "Loading DOOM-@evilution.zip (5.9 MB)...";
        fs.extract("/game/DOOM-@evilution.zip").then(function () {
          statusEl.textContent = "Starting DOOM.EXE...";
          setTimeout(function () {
            overlayEl.style.display = "none";
            dosCI = main(["-c", "cycles 25000", "-c", "cd DOOM", "-c", "DOOM.EXE"]);
            enforceCanvasScaling();
          }, 200);
        }).catch(function (err) {
          statusEl.textContent = "Extraction failed: " + err;
        });
      }).catch(function (err) {
        statusEl.textContent = "DOSBox initialization error: " + err;
      });
    })();
  </script>
</body>
</html>
